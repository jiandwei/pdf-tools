name: Build PDF Tools for Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-poppler
            mingw-w64-x86_64-poppler-data
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkg-config
            autoconf
            automake
            libtool
            git
      
      - name: Build epdfinfo
        run: |
          cd server
          autoreconf -i
          ./configure
          make
          
      - name: Collect dependencies
        run: |
          mkdir -p dist
          cp server/epdfinfo.exe dist/
          
          # 复制必需的 DLL（使用 ldd 自动检测）
          ldd server/epdfinfo.exe | grep mingw64 | awk '{print $3}' | while read dll; do
            if [ -f "$dll" ]; then
              cp "$dll" dist/
            fi
          done
          
          # 手动复制一些可能遗漏的关键 DLL
          cp /mingw64/bin/libpoppler-*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libcairo-*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libglib-*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libpng*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/zlib1.dll dist/ 2>/dev/null || true
          
          ls -lh dist/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-tools-windows-x64
          path: dist/*
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
